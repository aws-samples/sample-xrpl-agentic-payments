[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xrpl-agentcore-integration"
version = "0.1.0"
description = "Policy-governed AgentCore and XRPL cross-border transfer POC"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "ag-ui-protocol>=0.1.10",
  "ag-ui-strands>=0.1.5",
  "aws-opentelemetry-distro>=0.18.0",
  "bedrock-agentcore>=1.22.0",
  "boto3>=1.43.92",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "mangum>=0.19.0",
  "PyJWT>=2.10.1",
  "pydantic>=2.11.0",
  "strands-agents>=1.55.1",
  "uvicorn>=0.35.0",
  "xrpl-py>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
