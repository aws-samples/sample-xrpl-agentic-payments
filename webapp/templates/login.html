<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRPL Agentic Payments — Sign In</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
        .login-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px; }
        .login-logo { text-align: center; margin-bottom: 32px; }
        .login-logo h1 { font-size: 28px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .login-logo p { font-size: 13px; color: var(--text-muted); margin-top: 8px; }
        .login-field { margin-bottom: 16px; }
        .login-field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .login-field input { width: 100%; padding: 12px 16px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; transition: border-color 0.2s; }
        .login-field input:focus { border-color: var(--accent); }
        .login-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent-2), var(--accent)); border: none; border-radius: 8px; color: white; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: opacity 0.2s; }
        .login-btn:hover { opacity: 0.9; }
        .login-error { background: rgba(255,68,68,0.1); border: 1px solid rgba(255,68,68,0.2); color: var(--danger); padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
        .login-error.visible { display: block; }
        .login-footer { text-align: center; margin-top: 24px; font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <h1>XRPL Agentic Payments</h1>
                <p>Autonomous Cross-Border Payments on XRPL</p>
            </div>

            <div class="login-error" id="errorMsg">Invalid username or password.</div>

            <form method="POST" action="/login">
                <div class="login-field">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Enter username" required autofocus>
                </div>
                <div class="login-field">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>

            <div class="login-footer">
                AWS Bedrock AgentCore + XRP Ledger<br>
                Ripple Swell 2026 Demo
            </div>
        </div>
    </div>

    <script>
        if (location.search.includes('error=1')) {
            document.getElementById('errorMsg').classList.add('visible');
        }
    </script>
</body>
</html>
